name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 先把被改动模块的依赖装上（跳过测试，加速）
      - name: Build dependencies
        run: |
          mvn -B -ntp -DskipTests install \
            -pl yudao-gateway,yudao-framework/yudao-spring-boot-starter-security,yudao-framework/yudao-common -am

      # 只跑本项目新增/修改相关的测试，避免上游其它模块的环境依赖导致偶发失败
      - name: Run tests
        run: |
          mvn -B -ntp test \
            -pl yudao-framework/yudao-common,yudao-framework/yudao-spring-boot-starter-security,yudao-gateway \
            -Dtest='InternalSign*Test,GrayRoutingFilterTest,RateLimitFilterTest,TokenBucketRateLimiterContainerTest' \
            -DfailIfNoTests=false

      - name: Test summary
        if: always()
        run: echo "测试报告见各模块 target/surefire-reports"
